# Geolander's production container uses mod_php, which requires prefork. The
# upstream defaults allow 150 permanent PHP workers; that is appropriate for a
# host with an external capacity plan, not a small Railway service. Keep a
# small warm pool, cap concurrency, and recycle children so request-specific
# allocator high-water marks cannot accumulate indefinitely.
<IfModule mpm_prefork_module>
	StartServers 2
	MinSpareServers 2
	MaxSpareServers 4
	MaxRequestWorkers 8
	MaxConnectionsPerChild 250
</IfModule>

# A slow client otherwise owns an entire prefork/PHP process for too long.
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2

# Include the serving process and request duration in Railway logs so traffic
# can be correlated with child growth and recycling.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" pid=%P duration_us=%D" combined

ServerName localhost

# This application does not use XML-RPC, and wp-load.php is a bootstrap file,
# never a public endpoint. Production logs showed sustained hostile POSTs to
# both paths. Reject them during Apache authorization, before PHP/WordPress is
# invoked and a memory-bearing worker is occupied.
<Files "xmlrpc.php">
	Require all denied
</Files>

<Files "wp-load.php">
	Require all denied
</Files>

# Uploads live on a persistent Railway volume. They must remain static data,
# never executable server code, even if an application vulnerability writes a
# PHP-family file there.
<Directory "/var/www/html/wp-content/uploads">
	<FilesMatch "(?i:\.(?:php[0-9]?|phtml|phar))$">
		Require all denied
	</FilesMatch>
</Directory>

# Operators can inspect the prefork scoreboard with:
# railway ssh ... curl http://127.0.0.1/_internal-apache-status?auto
# A physical marker prevents WordPress's front-controller rewrite from taking
# the request. `Require local` keeps details unavailable through Railway's proxy.
ExtendedStatus On
<Files "_internal-apache-status">
	SetHandler server-status
	Require local
</Files>
